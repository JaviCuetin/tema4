spring.application.name=tema4

# i18n: ficheros messages*.properties en UTF-8
spring.messages.basename=messages
spring.messages.encoding=UTF-8
# Si el idioma pedido no esta soportado, usar messages.properties (no el idioma del sistema)
spring.messages.fallback-to-system-locale=false
# Si falta una clave, mostrar el codigo en vez de lanzar un error
spring.messages.use-code-as-default-message=true

# Archivos estaticos (videojuegos.html): que el navegador no los guarde en cache
spring.web.resources.cache.cachecontrol.no-store=true