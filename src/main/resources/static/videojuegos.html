<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro de Videojuegos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b1a;
    --panel: #14142b;
    --panel-2: #1b1b3a;
    --border: #2c2c58;
    --text: #e8e8ff;
    --muted: #9a9ac4;
    --accent: #8b5cf6;
    --accent-2: #22d3ee;
    --ok: #34d399;
    --error: #ff5c7a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 15% 10%, rgba(139,92,246,.25), transparent 40%),
      radial-gradient(circle at 85% 30%, rgba(34,211,238,.18), transparent 40%),
      var(--bg);
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; position: relative; }
  header { text-align: center; margin-bottom: 28px; }
  h1 {
    font-family: 'Orbitron', 'Segoe UI', sans-serif;
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    margin: 0 0 6px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    letter-spacing: 1px;
  }
  header p { margin: 0; color: var(--muted); }

  .lang { display: flex; justify-content: flex-end; gap: 6px; margin-bottom: 10px; }
  .lang button {
    padding: 6px 14px; font-size: .8rem; letter-spacing: 1px; color: var(--muted);
    background: transparent; border: 1.5px solid var(--border); border-radius: 999px;
  }
  .lang button:hover { color: var(--text); border-color: var(--muted); }
  .lang button.active { color: #fff; border-color: transparent; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

  .layout { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

  .card {
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 10px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(139,92,246,.08) inset;
  }
  .card h2 { font-family: 'Orbitron', sans-serif; font-size: 1.05rem; margin: 0 0 18px; color: var(--accent-2); letter-spacing: .5px; text-transform: uppercase; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 18px; }
  .full { grid-column: 1 / -1; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }

  .section-title { grid-column: 1 / -1; margin: 6px 0 -4px; font-size: .75rem; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); }

  label { display: block; font-size: .85rem; font-weight: 500; margin-bottom: 6px; color: var(--muted); }
  label small { color: #6c6c99; font-weight: 400; }
  input, select {
    width: 100%;
    padding: 11px 12px;
    font: inherit;
    color: var(--text);
    background: #0f0f24;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
    color-scheme: dark;
  }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139,92,246,.25); }
  .field.invalid input, .field.invalid select { border-color: var(--error); box-shadow: 0 0 0 3px rgba(255,92,122,.15); }
  .error { min-height: 0; margin-top: 6px; font-size: .8rem; color: var(--error); display: none; }
  .field.invalid .error { display: block; }
  .field.invalid .error::before { content: '⚠ '; }

  .actions { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 10px; padding: 12px 22px;
    transition: transform .1s, filter .15s;
  }
  button:active { transform: translateY(1px); }
  .primary { color: #fff; background: linear-gradient(90deg, var(--accent), #6366f1 60%, var(--accent-2)); box-shadow: 0 6px 20px rgba(139,92,246,.4); }
  .primary:hover { filter: brightness(1.1); }
  .secondary { color: var(--muted); background: transparent; border: 1.5px solid var(--border); }
  .secondary:hover { color: var(--text); border-color: var(--muted); }
  button:disabled { opacity: .6; cursor: wait; }

  .banner { display: none; margin-bottom: 18px; padding: 12px 14px; border-radius: 10px; font-size: .9rem; }
  .banner.show { display: block; }
  .banner.ok { background: rgba(52,211,153,.12); border: 1px solid var(--ok); color: var(--ok); }
  .banner.bad { background: rgba(255,92,122,.12); border: 1px solid var(--error); color: var(--error); }

  .games { display: grid; gap: 12px; }
  .empty { color: var(--muted); text-align: center; padding: 28px 8px; border: 1.5px dashed var(--border); border-radius: 12px; }
  .game { background: #0f0f24; border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; position: relative; overflow: hidden; }
  .game::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 4px; background: linear-gradient(var(--accent), var(--accent-2)); }
  .game h3 { margin: 0 0 6px; font-size: 1.02rem; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .tag { font-size: .72rem; padding: 3px 9px; border-radius: 999px; background: rgba(139,92,246,.18); color: #c4b5fd; }
  .tag.cyan { background: rgba(34,211,238,.15); color: #67e8f9; }
  .tag.pegi { background: rgba(255,92,122,.15); color: #ff9bb0; }
  .game p { margin: 2px 0; font-size: .82rem; color: var(--muted); }
  .rating { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; color: var(--ok); position: absolute; top: 12px; right: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="es">ES</button>
    <button type="button" data-lang="en">EN</button>
  </div>

  <header>
    <h1 data-i18n="title"></h1>
    <p data-i18n="subtitle"></p>
  </header>

  <div class="layout">
    <section class="card">
      <h2 data-i18n="newGame"></h2>
      <div id="banner" class="banner" role="status"></div>

      <form id="form" novalidate>
        <div class="grid">
          <div class="section-title" data-i18n="gameData"></div>

          <div class="field full">
            <label for="titulo"><span data-i18n="l.titulo"></span> <small data-i18n="h.titulo"></small></label>
            <input id="titulo" name="titulo" type="text" data-i18n-ph="p.titulo">
            <div class="error" data-error="titulo"></div>
          </div>

          <div class="field">
            <label for="genero" data-i18n="l.genero"></label>
            <select id="genero" name="genero">
              <option value="" data-i18n="choose"></option>
              <option value="Acción" data-i18n="g.Acción"></option>
              <option value="Aventura" data-i18n="g.Aventura"></option>
              <option value="RPG" data-i18n="g.RPG"></option>
              <option value="Deportes" data-i18n="g.Deportes"></option>
              <option value="Estrategia" data-i18n="g.Estrategia"></option>
              <option value="Terror" data-i18n="g.Terror"></option>
              <option value="Plataformas" data-i18n="g.Plataformas"></option>
              <option value="Simulación" data-i18n="g.Simulación"></option>
            </select>
            <div class="error" data-error="genero"></div>
          </div>

          <div class="field">
            <label for="plataforma" data-i18n="l.plataforma"></label>
            <select id="plataforma" name="plataforma">
              <option value="" data-i18n="choose"></option>
              <option value="PC" data-i18n="g.PC"></option>
              <option value="PlayStation 5" data-i18n="g.PlayStation 5"></option>
              <option value="Xbox Series" data-i18n="g.Xbox Series"></option>
              <option value="Nintendo Switch" data-i18n="g.Nintendo Switch"></option>
              <option value="Móvil" data-i18n="g.Móvil"></option>
            </select>
            <div class="error" data-error="plataforma"></div>
          </div>

          <div class="field">
            <label for="precio"><span data-i18n="l.precio"></span> <small data-i18n="h.precio"></small></label>
            <input id="precio" name="precio" type="number" step="0.01" placeholder="59.99">
            <div class="error" data-error="precio"></div>
          </div>

          <div class="field">
            <label for="pegi"><span data-i18n="l.pegi"></span> <small data-i18n="h.pegi"></small></label>
            <input id="pegi" name="pegi" type="number" placeholder="12">
            <div class="error" data-error="pegi"></div>
          </div>

          <div class="field">
            <label for="valoracion"><span data-i18n="l.valoracion"></span> <small data-i18n="h.valoracion"></small></label>
            <input id="valoracion" name="valoracion" type="number" placeholder="9">
            <div class="error" data-error="valoracion"></div>
          </div>

          <div class="field">
            <label for="fechaLanzamiento"><span data-i18n="l.fechaLanzamiento"></span> <small data-i18n="h.fechaLanzamiento"></small></label>
            <input id="fechaLanzamiento" name="fechaLanzamiento" type="date">
            <div class="error" data-error="fechaLanzamiento"></div>
          </div>

          <div class="field full">
            <label for="fechaProximoDlc"><span data-i18n="l.fechaProximoDlc"></span> <small data-i18n="h.fechaProximoDlc"></small></label>
            <input id="fechaProximoDlc" name="fechaProximoDlc" type="date">
            <div class="error" data-error="fechaProximoDlc"></div>
          </div>

          <div class="section-title" data-i18n="contactData"></div>

          <div class="field">
            <label for="contacto.nombre"><span data-i18n="l.cnombre"></span> <small data-i18n="h.cnombre"></small></label>
            <input id="contacto.nombre" name="contacto.nombre" type="text" data-i18n-ph="p.cnombre">
            <div class="error" data-error="contacto.nombre"></div>
          </div>

          <div class="field">
            <label for="contacto.email" data-i18n="l.cemail"></label>
            <input id="contacto.email" name="contacto.email" type="text" placeholder="usuario@gmail.com">
            <div class="error" data-error="contacto.email"></div>
          </div>
        </div>

        <div class="actions">
          <button class="primary" type="submit" id="enviar" data-i18n="save"></button>
          <button class="secondary" type="button" id="limpiar" data-i18n="clear"></button>
        </div>
      </form>
    </section>

    <aside class="card">
      <h2><span data-i18n="library"></span> (<span id="contador">0</span>)</h2>
      <div id="lista" class="games"></div>
    </aside>
  </div>
</div>

<script>
  // ---------- i18n del lado del navegador ----------
  // Los textos de ERROR vienen ya traducidos del servidor (messages_xx.properties).
  // Aquí se traducen solo los textos de la propia página.
  const TEXTOS = {
    es: {
      title: '🎮 REGISTRO DE VIDEOJUEGOS',
      subtitle: 'Añade un juego a la biblioteca. Los datos se validan en el servidor y no se aceptan si algo es incorrecto.',
      newGame: 'Nuevo juego', library: 'Biblioteca',
      gameData: 'Datos del juego', contactData: 'Contacto de quien lo registra',
      'l.titulo': 'Título', 'h.titulo': '(2–50 caracteres, no vacío)', 'p.titulo': 'Ej: The Legend of Zelda',
      'l.genero': 'Género', 'l.plataforma': 'Plataforma', choose: '— Elige —',
      'l.precio': 'Precio (€)', 'h.precio': '(mayor que 0)',
      'l.pegi': 'Edad mínima PEGI', 'h.pegi': '(3–18)',
      'l.valoracion': 'Valoración', 'h.valoracion': '(0–10)',
      'l.fechaLanzamiento': 'Fecha de lanzamiento', 'h.fechaLanzamiento': '(pasada)',
      'l.fechaProximoDlc': 'Próximo DLC', 'h.fechaProximoDlc': '(opcional; si lo pones, debe ser futura)',
      'l.cnombre': 'Nombre', 'h.cnombre': '(3–30 caracteres)', 'p.cnombre': 'Tu nombre',
      'l.cemail': 'Email',
      save: 'Guardar juego', clear: 'Limpiar',
      ok: '✔ Juego guardado correctamente.',
      fix: 'No se ha guardado: corrige los campos marcados en rojo.',
      server: 'Error inesperado del servidor',
      conn: 'No se pudo conectar con el servidor.',
      empty: 'Aún no hay juegos. ¡Registra el primero!',
      released: 'Lanzado el', dlc: 'Próximo DLC:', noDlc: 'Sin DLC previsto', by: 'Registrado por',
      'g.Acción': 'Acción', 'g.Aventura': 'Aventura', 'g.RPG': 'RPG', 'g.Deportes': 'Deportes',
      'g.Estrategia': 'Estrategia', 'g.Terror': 'Terror', 'g.Plataformas': 'Plataformas', 'g.Simulación': 'Simulación',
      'g.PC': 'PC', 'g.PlayStation 5': 'PlayStation 5', 'g.Xbox Series': 'Xbox Series',
      'g.Nintendo Switch': 'Nintendo Switch', 'g.Móvil': 'Móvil'
    },
    en: {
      title: '🎮 VIDEO GAME REGISTER',
      subtitle: 'Add a game to the library. Data is validated on the server and rejected if anything is wrong.',
      newGame: 'New game', library: 'Library',
      gameData: 'Game details', contactData: 'Contact of the person registering it',
      'l.titulo': 'Title', 'h.titulo': '(2–50 characters, not blank)', 'p.titulo': 'E.g. The Legend of Zelda',
      'l.genero': 'Genre', 'l.plataforma': 'Platform', choose: '— Choose —',
      'l.precio': 'Price (€)', 'h.precio': '(greater than 0)',
      'l.pegi': 'Minimum age PEGI', 'h.pegi': '(3–18)',
      'l.valoracion': 'Rating', 'h.valoracion': '(0–10)',
      'l.fechaLanzamiento': 'Release date', 'h.fechaLanzamiento': '(in the past)',
      'l.fechaProximoDlc': 'Next DLC', 'h.fechaProximoDlc': '(optional; if filled in, must be in the future)',
      'l.cnombre': 'Name', 'h.cnombre': '(3–30 characters)', 'p.cnombre': 'Your name',
      'l.cemail': 'Email',
      save: 'Save game', clear: 'Clear',
      ok: '✔ Game saved successfully.',
      fix: 'Not saved: fix the fields marked in red.',
      server: 'Unexpected server error',
      conn: 'Could not connect to the server.',
      empty: 'No games yet. Register the first one!',
      released: 'Released on', dlc: 'Next DLC:', noDlc: 'No DLC planned', by: 'Registered by',
      'g.Acción': 'Action', 'g.Aventura': 'Adventure', 'g.RPG': 'RPG', 'g.Deportes': 'Sports',
      'g.Estrategia': 'Strategy', 'g.Terror': 'Horror', 'g.Plataformas': 'Platformer', 'g.Simulación': 'Simulation',
      'g.PC': 'PC', 'g.PlayStation 5': 'PlayStation 5', 'g.Xbox Series': 'Xbox Series',
      'g.Nintendo Switch': 'Nintendo Switch', 'g.Móvil': 'Mobile'
    }
  };

  // Idioma inicial: el elegido antes (localStorage) o, si no hay, el del navegador
  let idioma = 'es';
  try { idioma = localStorage.getItem('lang') || ''; } catch (e) { idioma = ''; }
  if (!TEXTOS[idioma]) idioma = (navigator.language || 'es').toLowerCase().startsWith('en') ? 'en' : 'es';

  const t = (clave) => TEXTOS[idioma][clave] ?? clave;
  const localeNumeros = () => (idioma === 'en' ? 'en-GB' : 'es-ES');

  const form = document.getElementById('form');
  const banner = document.getElementById('banner');
  const lista = document.getElementById('lista');
  const campos = [...form.elements].filter(e => e.name);

  function aplicarIdioma() {
    document.documentElement.lang = idioma;
    document.title = idioma === 'en' ? 'Video Game Register' : 'Registro de Videojuegos';
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
    document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('active', b.dataset.lang === idioma));
  }

  function cambiarIdioma(nuevo) {
    idioma = nuevo;
    try { localStorage.setItem('lang', idioma); } catch (e) { /* sin almacenamiento: no pasa nada */ }
    limpiarErrores(); // los errores mostrados estaban en el idioma anterior
    aplicarIdioma();
    cargarLista();
  }

  // Cabecera que lee el servidor para decidir el idioma de los errores
  const cabeceras = (extra = {}) => ({ 'Accept-Language': idioma, ...extra });

  function valor(el) {
    const v = el.value;
    if (el.type === 'number') return v === '' ? null : Number(v);
    if (el.tagName === 'SELECT' || el.type === 'date') return v === '' ? null : v;
    return v; // texto: se envía tal cual (así "   " también lo rechaza el validator)
  }

  function construirJson() {
    const body = { contacto: {} };
    for (const el of campos) {
      if (el.name.startsWith('contacto.')) body.contacto[el.name.slice(9)] = valor(el);
      else body[el.name] = valor(el);
    }
    return body;
  }

  function limpiarErrores() {
    document.querySelectorAll('.field.invalid').forEach(f => f.classList.remove('invalid'));
    banner.className = 'banner';
  }

  function mostrarErrores(errores) {
    let sinCampo = [];
    for (const [campo, mensaje] of Object.entries(errores)) {
      const caja = document.querySelector(`[data-error="${CSS.escape(campo)}"]`);
      if (caja) {
        caja.textContent = mensaje;
        caja.closest('.field').classList.add('invalid');
      } else {
        sinCampo.push(mensaje);
      }
    }
    banner.className = 'banner show bad';
    banner.textContent = sinCampo.length ? sinCampo.join(' · ') : t('fix');
    const primero = document.querySelector('.field.invalid input, .field.invalid select');
    if (primero) primero.focus();
  }

  function tarjeta(j) {
    const d = document.createElement('div');
    d.className = 'game';
    const r = document.createElement('div'); r.className = 'rating'; r.textContent = j.valoracion + '/10';
    const h = document.createElement('h3'); h.textContent = j.titulo;
    const m = document.createElement('div'); m.className = 'meta';
    [[t('g.' + j.genero), ''], [t('g.' + j.plataforma), 'cyan'], ['PEGI ' + j.pegi, 'pegi']].forEach(([txt, c]) => {
      const s = document.createElement('span'); s.className = 'tag ' + c; s.textContent = txt; m.appendChild(s);
    });
    const precio = new Intl.NumberFormat(localeNumeros(), { style: 'currency', currency: 'EUR' }).format(j.precio);
    const fecha = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString(localeNumeros());
    const p1 = document.createElement('p');
    p1.textContent = `${precio} · ${t('released')} ${fecha(j.fechaLanzamiento)}`;
    const p2 = document.createElement('p');
    p2.textContent = j.fechaProximoDlc ? `${t('dlc')} ${fecha(j.fechaProximoDlc)}` : t('noDlc');
    const p3 = document.createElement('p');
    p3.textContent = `${t('by')} ${j.contacto.nombre} (${j.contacto.email})`;
    d.append(r, h, m, p1, p2, p3);
    return d;
  }

  async function cargarLista() {
    const res = await fetch('/api/videojuegos', { headers: cabeceras() });
    const juegos = await res.json();
    document.getElementById('contador').textContent = juegos.length;
    lista.replaceChildren();
    if (!juegos.length) {
      const e = document.createElement('div'); e.className = 'empty';
      e.textContent = t('empty');
      lista.appendChild(e);
      return;
    }
    juegos.slice().reverse().forEach(j => lista.appendChild(tarjeta(j)));
  }

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    limpiarErrores();
    const btn = document.getElementById('enviar');
    btn.disabled = true;
    try {
      const res = await fetch('/api/videojuegos', {
        method: 'POST',
        headers: cabeceras({ 'Content-Type': 'application/json' }),
        body: JSON.stringify(construirJson())
      });
      if (res.status === 201) {
        form.reset();
        banner.className = 'banner show ok';
        banner.textContent = t('ok');
        await cargarLista();
      } else if (res.status === 400) {
        const data = await res.json();
        mostrarErrores(data.errores || {});
      } else {
        banner.className = 'banner show bad';
        banner.textContent = t('server') + ' (' + res.status + ').';
      }
    } catch (e) {
      banner.className = 'banner show bad';
      banner.textContent = t('conn');
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById('limpiar').addEventListener('click', () => { form.reset(); limpiarErrores(); });
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => cambiarIdioma(b.dataset.lang)));

  // Al escribir en un campo, se quita su error
  form.addEventListener('input', (ev) => ev.target.closest('.field')?.classList.remove('invalid'));
  form.addEventListener('change', (ev) => ev.target.closest('.field')?.classList.remove('invalid'));

  aplicarIdioma();
  cargarLista();
</script>
</body>
</html>
